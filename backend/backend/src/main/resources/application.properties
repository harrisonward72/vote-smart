spring.application.name=backend

#Database config
spring.datasource.url=jdbc:mysql://localhost:3306/votesmart
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


#App Config
server.port=8080

##geocoding to convert address to coordinates
google.geocoding.api.key=${google.geocoding.api.key}


#Representative lookup by address
openstates.api.key=${openstates.api.key}

#ClaudAPIKey
anthropic.api.key=${anthropic.api.key}

#capitol trace api key 100 requests/day
capitoltrace.api.key=${capitoltrace.api.key}
